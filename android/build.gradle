group = 'com.example.fluttershare'
version = '1.0-SNAPSHOT'

// Không còn buildscript{} khai classpath AGP 3.3.0 ở đây nữa. Plugin được
// Flutter nạp vào chính build của app, nên AGP đã có sẵn trên classpath do
// settings.gradle của app khai `com.android.library`. Giữ lại classpath cũ chỉ
// tạo xung đột phiên bản, và repositories cũ còn gọi jcenter() — method này bị
// Gradle 9 gỡ hẳn nên chỉ cần đọc file là build vỡ.
//
// Repositories cũng bỏ luôn: allprojects{} trong build.gradle gốc của app đã
// cấp google() + mavenCentral() cho mọi subproject, kể cả plugin này.

apply plugin: 'com.android.library'

android {
    // AGP 8+ bắt buộc có namespace và cấm khai `package` trong AndroidManifest.
    // Lấy đúng package của FlutterSharePlugin.java và của khoá `android.package`
    // trong pubspec.yaml, để R/BuildConfig sinh ra cùng chỗ với mã nguồn.
    namespace = 'com.example.fluttershare'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    // lintOptions{} bị AGP 9 gỡ, thay bằng lint{}.
    lint {
        disable += 'InvalidPackage'
    }
}

dependencies {
    // Bỏ `api 'commons-io:commons-io:2.6'`: không dòng mã nào trong plugin
    // import org.apache.commons, mà `api` lại đẩy nguyên bản 2.6 (dính
    // CVE-2021-29425) vào classpath của app dùng plugin.
    implementation 'androidx.core:core:1.17.0'
}
